applications_information:
  source: 'Page: 43, layout_type: text, Block: 586'
  circuits:
  - name: Synthesizer Duplex Mode
    components:
    - LMX2571 (内部VCO)
    - TrCtl 引脚 (频率F1/F2与RF输出端口切换)
    - MULT 乘法器 (R-divider 内, 值为4)
    - 4FSK 直接数字调制 (FSK PIN 模式)
    formulas:
    - VCO 频率 = F1 × CHDIV = 902 MHz × 5 = 4510 MHz
    - fPD = MULT × fOSCin / Post-divider = 104 MHz (MULT=4, Post-divider=1)
    - N-divider = 21.68269231 (Ninteger=21, Nfrac=0.68269231)
    - DEN = 2^24 = 16777216
    - NUM = Nfrac × DEN = 11453676
    - FSK step = [频偏 × DEN / (fPD × 10^6)] × (CHDIV1/2)
    - 'FSK step: +10kHz=4033, -10kHz=61502, +30kHz=12099, -30kHz=53436'
  - name: PLL Duplex Mode
    components:
    - LMX2571 (外部VCO, 内部VCO旁路)
    - TS5A21366 双SPST模拟开关 (用于FastLock)
    - 外部VCO
    formulas:
    - PDF = 28 MHz (Pre-divider=1, MULT=5, Post-divider=3)
    - 'F1: N-divider=15.35714286 (Ninteger=15), F2: N-divider=17.14285714 (Ninteger=17)'
    - DEN = 1234567
    - NUM(F1)=440917, NUM(F2)=176367
    - '寄存器: EXTVCO_CP_IUP/IDN=8(1250μA), EXTVCO_SEL_F1/F2=1(外部VCO), CHDIV3旁路, R0.FCAL_EN=1启用FastLock'
  - name: Synthesizer/PLL Duplex Mode
    components:
    - LMX2571 (内部+外部VCO)
    - TrCtl 引脚 (切换内部/外部VCO)
    - 直接数字FSK调制 (FSK I2S模式)
    formulas:
    - RFoutRX = 440 MHz (外部VCO = F1)
    - RFoutTX = 540 MHz (内部VCO = F2)
    - FSK_MODE_SEL1=1, FSK_MODE_SEL=0, FSK_EN_F2=1
theory_of_operation:
  source: 'Page: 10, layout_type: text, Block: 127'
  principle: LMX2571是一款带低噪声高性能集成VCO的频率合成器。5-GHz VCO核配合输出通道分频器可产生10 MHz至1344 MHz频率。支持两种工作模式：合成器模式（使用整个器件）和PLL模式（旁路内部VCO，需外部VCO实现完整合成器）。PLL为分数-N
    PLL，带可编程Delta Sigma调制器（一阶至四阶），分数分母变长最高24位，提供极细频率步进分辨率。
  architecture: 参考时钟输入支持晶振（片上振荡器）、AC耦合差分时钟、DC耦合单端时钟（如XO/CMOS）。R-divider集成独特可编程乘法器（MULT），用于减少整数边界杂散或提高鉴相频率；内部VCO可旁路以使用外部VCO，并有独立5V电荷泵专供外部VCO（无需运放）；新型FastLock技术可将锁定时间缩短至1.5
    ms以下。输出含集成T/R开关，分频后的内部/外部VCO信号可输出至TX口或RX口，开关也可配置为1:2扇出缓冲器同时输出，且输出频率可在F1/F2间切换，适合FDD双工系统。仅需单一3.3V电源，数字逻辑接口1.8V输入兼容，模拟块电源用集成LDO；通过MICROWIRE接口编程，可通过寄存器编程或切换CE引脚断电。
