device_info:
  source: 'Page: 1, layout_type: text, Block: 0'
  device_name: LMX2571
  manufacturer: Texas Instruments
  device_type: RF频率合成器
  device_family: PLLatinum
basic_info:
  source: 'Page: 1, layout_type: text, Block: 25'
  description: LMX2571是一款低功耗、高性能、宽带PLLatinum™射频（RF）合成器，该合成器集成了Δ-Σ分数NPLL、多核压控振荡器（VCO）、可编程输出分压器以及两个输出缓冲器。VCO内核的工作频率高达5.376GHz，持续输出频率范围为10MHz至1344MHz。
  highlights:
  - 低功耗、高性能、宽带PLLatinum RF合成器
  - 集成Δ-Σ分数NPLL、多核VCO和两个输出缓冲器
  - VCO内核工作频率高达5.376GHz
  - 持续输出频率范围10MHz至1344MHz
features:
  source: 'Page: 1, layout_type: text, Block: 1'
  items:
  - 输出频率范围：10MHz 至 1344MHz
  - 低相位噪声和毛刺
  - 12.5kHz偏移@480MHz时为-123dBc/Hz
  - 1MHz偏移 @480MHz时为-145dBc/Hz
  - 标准化锁相环（PLL）噪底为-231dBc/Hz
  - 杂散优于 -75dBc/Hz
  - 新型 FastLock 技术，缩短了锁定时间
  - 新型整数边界毛刺去除技术
  - 集成5V电荷泵和输出驱动器，用于外部压控振荡器（VCO）操作
  - 2、4和8电平或任意电平数直接数字移频键控(FSK)调制
  - 一个 TX/RX 输出或两个扇出输出
  - 晶振、XO或差分参考时钟输入
  - 低电流消耗
  - 39mA典型合成器模式（内部VCO）/ 9mA典型PLL模式（外部VCO）
  - 24位分数N Δ-Σ调制器
