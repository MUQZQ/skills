composition_rules:
- rule: R_A
  desc: 诊断类输出自动衔接 SCQA
- rule: R_B
  desc: MECE 先于 5 Whys
- rule: R_C
  desc: Pre-mortem 先于 FMEA
- rule: R_D
  desc: 用户显式指定 > 路由推荐
- rule: R_E
  desc: 同一目的的替代 Skill 不重复运行；承担不同阶段职责的互补链可以组合
- rule: R_F
  desc: 管理协作先建立 RACI，再生成委派和并行计划
- rule: R_G
  desc: 仅依赖就绪且安全隔离的工作进入并行 WIP；验收完成后立即释放后继，不为填槽拆分内聚场景
- rule: R_H
  desc: 任务不清晰时执行者先向唯一 A 提问，不得自行补全授权
- rule: R_I
  desc: 时间盒到期只能验收、带证据重排或升级阻塞，不得静默延长或跳过验证
- rule: R_J
  desc: 空白任务先用 Discovery Sprint 建立证据和首个实验，问题明确后重新分类；探索不自动授权实施
