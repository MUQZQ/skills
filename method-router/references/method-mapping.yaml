# 方法论路由映射表 v3.6
# 新增 Skill 先更新根注册表；仅意图路由变化时在此添加记录
# 无需修改 SKILL.md
# v3.6: +确定性路由契约、显式上下文字段、类型兜底和可审计 rationale
# v3.5: +Discovery Sprint，覆盖空白任务的联网调研、头脑风暴和首个实验
# v3.4: +18 新框架（鱼骨图/二阶思考/Impact-Effort/六顶帽/帕累托/SMART/OKR/SBI/JTBD/SCAMPER/情景规划/Kano/SIPOC/费曼/对标/FTA/GTD/双环学习）+ goal/learning 分类
version: '3.6'
authority_scope: domain_intent_routing
source_of_truth: true
registry_source: ../../skill-domain-mapping.yaml
last_updated: '2026-09-01'
route_context:
  fields:
    type: required; classify to one of diagnose/decide/design/improve/risk/report/manage/goal/learning
    urgency: required; critical or normal; default normal
    domain: required; code/data/architecture/process/general; default general; data includes logs and metrics
    has_data: required; true/false/unknown; default unknown
    complexity: required; high/normal/unknown; default unknown
    sub_type: required; route-specific value or unknown
    scope: required; route-specific value or unknown
    cynefin_pre: required; true or false; default false
  derivation: derive every field from explicit user wording and verified project context; never infer missing authorization
  unknown_policy: use unknown for absent evidence; do not coerce unknown to false
resolution:
  strategy: highest_priority_then_specificity
  preprocess: execute_meta_route_when_cynefin_pre_true
  default_priority: 500
  specificity: number_of_matched_condition_fields
  tie_breaker: ask_user_with_top_3
  no_match: type_fallback
  explicit_user_skill: overrides_route_recommendation
classification:
  diagnose:
    keywords:
    - 为什么
    - 报错
    - 失败
    - 异常
    - 不对
    - bug
    - 排查
    - 定位
    - 原因
    - 根因
    examples:
    - 匹配率为什么这么低
    - 这个接口一直报错
  decide:
    keywords:
    - 选哪个
    - 要不要
    - 优先级
    - 对比
    - 方案
    - 技术选型
    examples:
    - 用 Redis 还是 Kafka
    - 这三个方案哪个好
  design:
    keywords:
    - 完全初始
    - 从零开始
    - 完全没思路
    - 先调研
    - 网上实践
    - 行业实践
    - 头脑风暴
    - 探索方向
    - 设计
    - 架构
    - 重构
    - 新功能
    - 怎么实现
    - 搭建
    examples:
    - 我只有一个粗略想法，先查网上实践并头脑风暴
    - 设计一个消息推送系统
    - 这个模块需要重构
  improve:
    keywords:
    - 优化
    - 提升
    - 改进
    - 加速
    - 减少
    - 自动化
    - 太慢
    examples:
    - 这个接口太慢了
    - 能不能优化一下 CI 流程
  risk:
    keywords:
    - 风险
    - 安全
    - 漏洞
    - 事故
    - 万一
    - 上线
    - 有问题吗
    examples:
    - 这个改动能上线吗
    - 有什么安全风险
  report:
    keywords:
    - 总结
    - 汇报
    - 周报
    - 复盘
    - 文档
    - 记录
    - 写报告
    examples:
    - 帮我写个复盘报告
    - 本周工作总结
  manage:
    keywords:
    - 管理
    - 协作
    - 分工
    - 委派
    - 责任
    - 协调
    - 资源
    - 排期
    - 子 Agent
    - 卡槽
    - DAG
    - 有向无环图
    - 依赖图
    - 拓扑
    - 关键路径
    - 时间
    - 截止
    - 超时
    - 进度
    - 升级
    examples:
    - Sol 和 Luna 怎么分工
    - 如何安排多个子 Agent 协作
    - 如何避免 Luna 超时
  goal:
    keywords:
    - 目标
    - OKR
    - KPI
    - 减肥
    - 学习计划
    - 愿景
    - 里程碑
    - flag
    - 定目标
    - 达成
    examples:
    - 帮我定个季度减肥目标
  learning:
    keywords:
    - 学习
    - 理解
    - 弄懂
    - 掌握
    - 复习
    - 讲给别人听
    - 面试
    - 简单解释
    examples:
    - 这个机制我是不是真懂了
urgency:
  critical:
    keywords:
    - 线上故障
    - 挂了
    - 紧急
    - 用户投诉
    - 宕机
    - 马上
    - 立刻
    action: skip_confirmation
  normal:
    keywords: []
    action: show_route_for_confirmation
fallbacks:
  diagnose:
    action: ask_user_with_top_3
  decide:
    action: ask_user_with_top_3
  design:
    action: ask_user_with_top_3
  improve:
    action: ask_user_with_top_3
  risk:
    action: ask_user_with_top_3
  report:
    action: ask_user_with_top_3
  manage:
    action: ask_user_with_top_3
  goal:
    action: ask_user_with_top_3
  learning:
    action: ask_user_with_top_3
routes:
- type: meta
  priority: 1000
  condition:
    cynefin_pre: true
  chain:
  - skill_name: cynefin
    order: 0
    mandatory: false
  rationale: 因为问题域尚未确定，选择 Cynefin 预分类而非直接套用具体方法
- type: diagnose
  priority: 300
  condition:
    has_data: true
    domain: data
  chain:
  - skill_name: deep-analysis
    order: 1
    mandatory: true
  - skill_name: scqa
    order: 2
    mandatory: true
  rationale: 因为已有量化数据且领域为数据分析，选择 Deep Analysis 而非无数据的 5 Whys
- type: diagnose
  priority: 300
  condition:
    has_data: false
  chain:
  - skill_name: 5whys
    order: 1
    mandatory: true
  - skill_name: scqa
    order: 2
    mandatory: true
  rationale: 因为缺少量化数据，选择 5 Whys 逐层追问而非依赖指标的 Deep Analysis
- type: diagnose
  priority: 700
  condition:
    complexity: high
  chain:
  - skill_name: mece
    order: 1
    mandatory: true
  - skill_name: 5whys
    order: 2
    mandatory: true
  - skill_name: scqa
    order: 3
    mandatory: true
  rationale: 因为问题复杂但尚未指明多因素类型，选择 MECE 后接 5 Whys 而非单线追问
- type: diagnose
  priority: 900
  condition:
    urgency: critical
  chain:
  - skill_name: ooda-loop
    order: 1
    mandatory: true
  - skill_name: scqa
    order: 2
    mandatory: false
  rationale: 因为处于紧急故障，选择 OODA 快速闭环而非先做完整静态分类
- type: decide
  condition:
    sub_type: priority
  chain:
  - skill_name: eisenhower-matrix
    order: 1
    mandatory: true
  - skill_name: star
    order: 2
    mandatory: false
  rationale: 因为任务需按重要与紧急排序，选择 Eisenhower 而非面向需求量化的 RICE
- type: decide
  condition:
    sub_type: priority_quant
  chain:
  - skill_name: rice
    order: 1
    mandatory: true
  rationale: 因为需求优先级需要量化比较，选择 RICE 而非只做四象限归类
- type: decide
  condition:
    sub_type: comparison
  chain:
  - skill_name: pugh-matrix
    order: 1
    mandatory: true
  - skill_name: adr
    order: 2
    mandatory: false
  rationale: 因为多个方案需要统一标准比较，选择 Pugh Matrix 而非仅凭直觉决策
- type: decide
  condition:
    sub_type: tech_selection
  chain:
  - skill_name: adl-matrix
    order: 1
    mandatory: true
  - skill_name: adr
    order: 2
    mandatory: false
  rationale: 因为技术选型涉及生命周期与竞争位置，选择 ADL Matrix 而非通用方案打分
- type: manage
  condition:
    sub_type: role_split
  chain:
  - skill_name: management-collaboration
    order: 1
    mandatory: true
  - skill_name: scqa
    order: 2
    mandatory: false
  rationale: 因为问题核心是角色分工与委派，选择 Management Collaboration 而非个人任务管理
- type: manage
  condition:
    sub_type: parallel_scheduling
  chain:
  - skill_name: management-collaboration
    order: 1
    mandatory: true
  - skill_name: scqa
    order: 2
    mandatory: false
  rationale: 因为存在并行卡槽与依赖波次，选择 Management Collaboration 而非无依赖的任务清单
- type: manage
  condition:
    sub_type: time_management
  chain:
  - skill_name: management-collaboration
    order: 1
    mandatory: true
  - skill_name: eisenhower-matrix
    order: 2
    mandatory: false
  - skill_name: scqa
    order: 3
    mandatory: false
  rationale: 因为需要同时管理时间盒和关键路径，选择 Management Collaboration 而非只做优先级矩阵
- type: manage
  condition:
    sub_type: escalation
  chain:
  - skill_name: management-collaboration
    order: 1
    mandatory: true
  - skill_name: ooda-loop
    order: 2
    mandatory: true
  - skill_name: scqa
    order: 3
    mandatory: false
  rationale: 因为出现协作阻塞或冲突，选择 Management Collaboration 加 OODA 而非静态职责表
- type: manage
  condition:
    sub_type: improvement
  chain:
  - skill_name: management-collaboration
    order: 1
    mandatory: true
  - skill_name: pdca-tuning
    order: 2
    mandatory: true
  - skill_name: scqa
    order: 3
    mandatory: false
  rationale: 因为协作机制反复低效，选择 Management Collaboration 加 PDCA 而非一次性任务重排
- type: manage
  priority: 0
  condition: {}
  chain:
  - skill_name: management-collaboration
    order: 1
    mandatory: true
  - skill_name: scqa
    order: 2
    mandatory: false
  rationale: 因为只有一般管理协作意图，选择 Management Collaboration 而非猜测具体管理子类型
- type: design
  condition:
    scope: blank_slate
  chain:
  - skill_name: discovery-sprint
    order: 1
    mandatory: true
  rationale: 因为任务完全初始且问题框架未定，选择 Discovery Sprint 而非直接进入方案实施
- type: design
  condition:
    scope: new_system
  chain:
  - skill_name: design-thinking
    order: 1
    mandatory: true
  - skill_name: adr
    order: 2
    mandatory: false
  rationale: 因为要从用户需求出发设计新系统，选择 Design Thinking 而非从既有结构直接重构
- type: design
  condition:
    scope: refactor
  chain:
  - skill_name: first-principles
    order: 1
    mandatory: true
  - skill_name: adr
    order: 2
    mandatory: false
  rationale: 因为需要重建既有架构假设，选择 First Principles 而非沿用历史类比
- type: improve
  condition:
    domain: process
  chain:
  - skill_name: pdca-tuning
    order: 1
    mandatory: true
  - skill_name: a3-report
    order: 2
    mandatory: false
  rationale: 因为目标是持续优化流程，选择 PDCA 而非一次性数据统计
- type: improve
  condition:
    domain: data
  chain:
  - skill_name: dmaic
    order: 1
    mandatory: true
  - skill_name: a3-report
    order: 2
    mandatory: false
  rationale: 因为改进依赖可测数据与稳定过程，选择 DMAIC 而非经验型 PDCA 起步
- type: risk
  condition:
    scope: code_change
  chain:
  - skill_name: pre-mortem
    order: 1
    mandatory: true
  - skill_name: scqa
    order: 2
    mandatory: true
  rationale: 因为代码变更尚未发生且需提前暴露失败，选择 Pre-mortem 而非事后根因分析
- type: risk
  condition:
    scope: systematic
  chain:
  - skill_name: fmea
    order: 1
    mandatory: true
  - skill_name: scqa
    order: 2
    mandatory: true
  rationale: 因为要系统枚举失效模式并量化风险，选择 FMEA 而非只推演单一顶事件
- type: report
  condition:
    sub_type: retrospective
  chain:
  - skill_name: star
    order: 1
    mandatory: true
  - skill_name: scqa
    order: 2
    mandatory: false
  rationale: 因为需要按情境任务行动结果复盘，选择 STAR 而非轻量三栏 KPT
- type: report
  condition:
    sub_type: kpt
  chain:
  - skill_name: kpt-review
    order: 1
    mandatory: true
  rationale: 因为这是高频轻量复盘，选择 KPT 而非完整事件叙事 STAR
- type: report
  priority: 0
  condition: {}
  chain:
  - skill_name: scqa
    order: 1
    mandatory: true
  rationale: 因为未识别到具体汇报子类型，选择 SCQA 通用叙事而非猜测专项复盘框架
- type: diagnose
  priority: 800
  condition:
    sub_type: multi_factor
  chain:
  - skill_name: fishbone
    order: 1
    mandatory: true
  - skill_name: 5whys
    order: 2
    mandatory: true
  - skill_name: scqa
    order: 3
    mandatory: false
  rationale: 因为问题明确包含多因素，选择 Fishbone 后接 5 Whys 而非直接沿单一路径追问
- type: decide
  condition:
    sub_type: quick_priority
  chain:
  - skill_name: impact-effort
    order: 1
    mandatory: true
  rationale: 因为需要快速按影响与努力排序，选择 Impact-Effort 而非信息要求更高的 RICE
- type: decide
  condition:
    sub_type: consequence_check
  chain:
  - skill_name: second-order
    order: 1
    mandatory: true
  - skill_name: scqa
    order: 2
    mandatory: false
  rationale: 因为重点是推演决策后果链，选择 Second-Order Thinking 而非仅比较当下得分
- type: manage
  condition:
    sub_type: structured_discussion
  chain:
  - skill_name: six-hats
    order: 1
    mandatory: true
  rationale: 因为需要让讨论视角有序切换，选择 Six Hats 而非职责与排期管理
- type: improve
  condition:
    sub_type: focus
  chain:
  - skill_name: pareto
    order: 1
    mandatory: true
  rationale: 因为需要先找出关键少数，选择 Pareto 而非平均分配改进资源
- type: goal
  condition:
    sub_type: goal_setup
  chain:
  - skill_name: okr
    order: 1
    mandatory: true
  - skill_name: smart
    order: 2
    mandatory: true
  rationale: 因为需要建立目标体系并校验质量，选择 OKR 加 SMART 而非只写单一目标句
- type: goal
  condition:
    sub_type: goal_quality
  chain:
  - skill_name: smart
    order: 1
    mandatory: true
  rationale: 因为已有目标只需检查可执行性，选择 SMART 而非重新搭建 OKR 体系
- type: report
  condition:
    sub_type: feedback
  chain:
  - skill_name: sbi
    order: 1
    mandatory: true
  rationale: 因为要提供基于行为的反馈，选择 SBI 而非通用汇报叙事
- type: design
  condition:
    scope: user_insight
  chain:
  - skill_name: jtbd
    order: 1
    mandatory: true
  - skill_name: design-thinking
    order: 2
    mandatory: false
  rationale: 因为需要先理解用户雇佣产品完成的任务，选择 JTBD 后接 Design Thinking 而非直接画方案
- type: design
  condition:
    scope: enhance_existing
  chain:
  - skill_name: scamper
    order: 1
    mandatory: true
  - skill_name: impact-effort
    order: 2
    mandatory: false
  rationale: 因为目标是改造现有方案，选择 SCAMPER 加 Impact-Effort 而非从零设计
- type: design
  condition:
    scope: requirement_classify
  chain:
  - skill_name: kano
    order: 1
    mandatory: true
  rationale: 因为需要区分基本型期望型与惊喜型需求，选择 Kano 而非直接做优先级打分
- type: risk
  condition:
    sub_type: long_term
  chain:
  - skill_name: scenario-planning
    order: 1
    mandatory: true
  rationale: 因为风险来自长期关键变量的不确定组合，选择 Scenario Planning 而非单一路径预测
- type: risk
  condition:
    sub_type: top_down
  chain:
  - skill_name: fta
    order: 1
    mandatory: true
  rationale: 因为要从顶事件向下定位失效组合，选择 FTA 而非先做全流程 FMEA
- type: improve
  condition:
    sub_type: process_define
  chain:
  - skill_name: sipoc
    order: 1
    mandatory: true
  - skill_name: pdca-tuning
    order: 2
    mandatory: false
  rationale: 因为流程边界与上下游尚未定义，选择 SIPOC 后接 PDCA 而非直接进入改进循环
- type: improve
  condition:
    sub_type: compare
  chain:
  - skill_name: benchmarking
    order: 1
    mandatory: true
  - skill_name: smart
    order: 2
    mandatory: false
  rationale: 因为需要用外部标杆量化差距，选择 Benchmarking 加 SMART 而非内部自评
- type: learning
  condition:
    sub_type: verify_understanding
  chain:
  - skill_name: feynman
    order: 1
    mandatory: true
  rationale: 因为目标是暴露理解漏洞，选择 Feynman Technique 而非被动复述资料
- type: manage
  condition:
    sub_type: personal_tasks
  chain:
  - skill_name: gtd
    order: 1
    mandatory: true
  rationale: 因为要收集并组织个人任务，选择 GTD 而非多人职责协作框架
- type: report
  condition:
    sub_type: deep_retro
  chain:
  - skill_name: double-loop
    order: 1
    mandatory: true
  rationale: 因为要追问反复问题背后的规则与假设，选择 Double-Loop Learning 而非只记录事件经过
